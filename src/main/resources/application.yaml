server:
  port: 8001
  error:
    include-message: never
spring:
  application:
    name: aicademiya
  task:
    scheduling:
      pool:
        size: 3
  sql:
    init:
      mode: never
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
app:
  upload-dir: /data/uploads
  trash-dir: /data/recycle
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
