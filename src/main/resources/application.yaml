server:
  port: 8001
  error:
    include-message: never
spring:
  application:
    name: aicademiya
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/aicademiya?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: 'aicademiya'
    password: '1890D27A0AC67AD022DB0B3971572D2B1D7B582BF6ABD4B3'
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
app:
  config-path: ${AICADEMIYA_CONFIG:config.json}
  upload-dir: ${AICADEMIYA_UPLOAD_DIR:data-local/uploads}
  document-max-units: ${AICADEMIYA_DOCUMENT_MAX_UNITS:300}
  document-max-characters: ${AICADEMIYA_DOCUMENT_MAX_CHARACTERS:300000}
  document-image-max-edge: ${AICADEMIYA_DOCUMENT_IMAGE_MAX_EDGE:2000}
  allowed-origins: ${AICADEMIYA_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  cookie-secure: ${AICADEMIYA_COOKIE_SECURE:false}
  demo-enabled: ${AICADEMIYA_DEMO_ENABLED:false}
  history-max-answers: ${AICADEMIYA_HISTORY_MAX_ANSWERS:50}
  history-max-conversations: ${AICADEMIYA_HISTORY_MAX_CONVERSATIONS:10}
  history-max-messages: ${AICADEMIYA_HISTORY_MAX_MESSAGES:200}
  attachment-max-bytes: ${AICADEMIYA_ATTACHMENT_MAX_BYTES:524288000}
  upload-warning-bytes: ${AICADEMIYA_UPLOAD_WARNING_BYTES:10737418240}
  trash-dir: ${AICADEMIYA_TRASH_DIR:}
  legacy-import: ${AICADEMIYA_LEGACY_IMPORT:}

# 供 Docker MySQL 首次初始化使用；不会修改现有数据库密码。
mysql:
  root-password: '9EF1A015A1FDA62ADEE14BA6D3F6F3FFFD7B19F23630CB1A'
