name: zzm-local
services:
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - ./application.yaml:/app/config/application.yaml:ro
      - ./data-local/uploads:/app/data/uploads
      - ../智能体回收站/垃圾桶/AIcademiya:/app/data/recycle
    networks:
      - default
      - existing-mysql
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  existing-mysql:
    external: true
    name: local_default
