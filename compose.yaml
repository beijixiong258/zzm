# Keep the existing Compose project and volume names after moving to the root.
name: app
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aicademiya
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER from spring.datasource.username in application.yaml}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD from spring.datasource.password in application.yaml}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD from mysql.root-password in application.yaml}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/aicademiya?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      AICADEMIYA_CONFIG: /config/config.json
      AICADEMIYA_UPLOAD_DIR: /data/uploads
      AICADEMIYA_TRASH_DIR: /data/recycle
      AICADEMIYA_DOCUMENT_MAX_UNITS: ${AICADEMIYA_DOCUMENT_MAX_UNITS:-300}
      AICADEMIYA_DOCUMENT_MAX_CHARACTERS: ${AICADEMIYA_DOCUMENT_MAX_CHARACTERS:-300000}
      AICADEMIYA_DOCUMENT_IMAGE_MAX_EDGE: ${AICADEMIYA_DOCUMENT_IMAGE_MAX_EDGE:-2000}
      AICADEMIYA_DEMO_ENABLED: ${AICADEMIYA_DEMO_ENABLED:-false}
      AICADEMIYA_COOKIE_SECURE: "false"
      AICADEMIYA_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AICADEMIYA_AI_BASE_URL: ${AICADEMIYA_AI_BASE_URL:-}
      AICADEMIYA_AI_MODEL: ${AICADEMIYA_AI_MODEL:-}
      AICADEMIYA_AI_API_KEY: ${AICADEMIYA_AI_API_KEY:-}
    volumes:
      - uploads:/data/uploads
      - "${AICADEMIYA_TRASH_HOST_DIR:-C:/Users/user/Desktop/智能体回收站/垃圾桶/AIcademiya}:/data/recycle"
      - ./config.json:/config/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "try { const response = await fetch('http://127.0.0.1:5173/', { method: 'HEAD', signal: AbortSignal.timeout(3000) }); process.exit(response.ok ? 0 : 1); } catch { process.exit(1); }"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  mysql-data:
  uploads:
  recycle:
