name: zzm-local
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    volumes:
      - ./application.yaml:/app/config/application.yaml:ro
      - ./data-local/uploads:/app/data/uploads
      - ../智能体回收站/垃圾桶/AIcademiya:/app/data/recycle
    networks:
      - default
      - existing-mysql
      - retrieval
  retrieval:
    build:
      context: .
      dockerfile: Dockerfile
      target: retrieval
    restart: unless-stopped
    volumes:
      - retrieval-data:/data
    networks:
      - retrieval
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
networks:
  retrieval:
  existing-mysql:
    external: true
    name: local_default
volumes:
  retrieval-data:
