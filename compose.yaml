name: zzm-local
services:
  backend:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    volumes:
      - ./application.yaml:/app/config/application.yaml:ro
      - ./data-local/uploads:/app/data/uploads
      - ../智能体回收站/垃圾桶/AIcademiya:/app/data/recycle
    networks:
      - default
      - existing-mysql
  frontend:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
networks:
  existing-mysql:
    external: true
    name: local_default
